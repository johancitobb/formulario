<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="css/form.css">
</head>
<body>
    <div>
        <header>
            <h2>Ingrese Datos</h2>
        </header>
    </div>
    <div>
        <form action="" id="FormNumeros">
            <div>
                <label for="N1">Ingrese el primer numero: </label>
                <input type="text" id="N1" required>
            </div>
            <div>
                <label for="N2">Ingrese el segundo numero: </label>
                <input type="text" id="N2" required>
            </div>
             <div>
                 <input type="submit" value="Ingrese datos">
        </form>
    
    </div>
    <div>
        <h3>Resultado</h3>
        <div id="resultados"></div>
    </div>

    <script src="js/form.js"></script>
    
</body>
</html>
